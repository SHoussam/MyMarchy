add_newline = true
command_timeout = 500

format = """
[┌─](dimmed white)$os$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$docker_context$cmd_duration$battery$time
[└─](dimmed white)$character """

[os]
disabled = false
style = "bold #a3bfd1"

[os.symbols]
Arch = "󰣇 "
EndeavourOS = "󰣇 "
Linux = "󰣇 "

[username]
show_always = true
style_user = "bold #bea3c7"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "dimmed white"
format = "[@$hostname]($style) in "

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #7d82d9"
format = "[ $path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #e9bb4f"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #ed5b5a"
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = " "
up_to_date = ""
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = "󰌟 "
style = "bold #92a593"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #e9bb4f"
format = "via [${symbol}${pyenv_prefix}(${version} )]($style)"

[rust]
symbol = " "
style = "bold #ed5b5a"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #7d82d9"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold #6d7db6"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold #f7dc9c"
format = "took [$duration]($style) "

[time]
disabled = false
time_format = "%R"
style = "dimmed white"
format = "at [ $time]($style)"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 100
style = "dimmed green"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold red)"
