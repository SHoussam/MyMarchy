[main]
capslock = overload(nav, capslock)

[nav]
# Inverted-T arrows (I=Up, J=Left, K=Down, L=Right; combines with Super/Ctrl/Alt/Shift)
i = up
j = left
k = down
l = right

# Navigation & missing 60% keys (U=Home / O=End flank I just like a TKL cluster)
u = home
o = end
leftbrace = pageup
rightbrace = pagedown
esc = grave
backspace = delete
p = sysrq

# Function row F1-F12
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12

# Media & brightness controls
m = mute
comma = volumedown
dot = volumeup
slash = playpause
semicolon = brightnessdown
apostrophe = brightnessup
