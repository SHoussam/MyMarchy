context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise-Canceled Microphone (RNNoise)"
            media.name       = "Noise-Canceled Microphone (RNNoise)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" = 50.0
                        }
                    }
                ]
            }
            audio.rate     = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name          = "rnnoise_mic_capture"
                node.passive       = true
                target.object      = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
                node.dont-move     = true
                node.dont-fallback = true
                node.linger        = true
            }
            playback.props = {
                node.name        = "rnnoise_mic_source"
                node.description = "Noise-Canceled Microphone (RNNoise)"
                media.class      = "Audio/Source"
                priority.session = 2500
                priority.driver  = 2500
            }
        }
    }
]
