[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=8
pad=14x14
initial-window-mode=windowed
workers=0
title=MyMarchy // Terminal Telemetry

[scrollback]
lines=10000
multiplier=5.0
indicator-position=fixed
indicator-format=percentage

[cursor]
style=beam
blink=yes
beam-thickness=1.8

[colors-dark]
cursor=08080a 507D00

[bell]
urgent=yes
visual=yes

[url]
launch=xdg-open ${url}
osc8-underline=always

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v Control+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
